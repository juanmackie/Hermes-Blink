name: ci
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python validator + plugin tests
        run: |
          HERMES_WIDGET_FORCE_ENV=supported python -m unittest discover -s hermes-plugin/hermes-widget/tests -v
      - name: Secret scan (no tokens/keystores/DBs tracked)
        run: |
          ! git ls-files | grep -E '\.db$|widget\.db|agent_token|\.keystore|\.jks|\.p8|local\.properties' && echo "secret scan: no tracked secrets"
          test -f android/gradlew && test -f android/gradle/wrapper/gradle-wrapper.jar && echo "wrapper present"
          ! grep -R "C:/Users" android/gradle.properties hermes-plugin/hermes-widget/cli.py || (echo "machine-specific paths found"; exit 1)
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Android unit tests (wrapper only, no local.properties)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --rerun-tasks
