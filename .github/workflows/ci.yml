name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hermes-plugin/hermes-widget/requirements.txt
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Install optional preview backends for the full contract suite
        run: python -m pip install "Pillow>=10.4,<13" "CairoSVG>=2.7,<3"
      - name: Lint Python plugin
        run: |
          python -m pip install ruff
          ruff check hermes-plugin/hermes-widget
      - name: Python validator + plugin tests
        env:
          HERMES_WIDGET_FORCE_ENV: supported
          PYTHONWARNINGS: error::ResourceWarning
          PYTHONDEVMODE: "1"
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
      - name: Contract parity across host and Android contracts
        run: python scripts/check-contract-parity.py
      # Field round 8: an unquoted ": " in one step name made the whole workflow
      # unparseable, so GitHub scheduled nothing and CI was green for four commits
      # without ever running a job. A workflow that cannot parse must fail loudly here.
      - name: Workflow parses and has steps
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check-workflow-yaml.py
  # The publication preview has two optional text backends. Exercise both explicitly;
  # the host plugin suite also installs them so it can assert a real renderer is available.
  preview-renderers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cairosvg, pillow-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: hermes-plugin/hermes-widget/requirements.txt
      - name: Install host test dependencies
        if: matrix.backend == 'cairosvg'
        run: |
          python -m pip install -r hermes-plugin/hermes-widget/requirements.txt
          python -m pip install "Pillow>=10.4,<13" "CairoSVG>=2.7,<3"
      - name: Install Pillow only (no CairoSVG)
        if: matrix.backend == 'pillow-only'
        run: python -m pip install "Pillow>=10.4,<13"
      - name: Show which text backend is importable
        run: |
          python -c "import importlib.util as u; print('cairosvg:', bool(u.find_spec('cairosvg')))"
      # `-p` takes one pattern, and the dashed plugin directory is not importable as a
      # dotted module, so discovery is the only invocation that works here.
      - name: Publication preview tests (this backend)
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests
          -p "test_feature_proposals.py"
  # The Windows launcher branch is exercised on a real Windows interpreter; the
  # same tests run on Linux above by patching the hook's platform decision.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hermes-plugin/hermes-widget/requirements.txt
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Install optional preview backends for the full contract suite
        run: python -m pip install "Pillow>=10.4,<13" "CairoSVG>=2.7,<3"
      - name: Python validator + plugin tests on Windows
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan and wrapper checks
        run: |
          if git ls-files | grep -Eq \
            '\.db$|widget\.db|agent_token|\.keystore|\.jks|\.p8|local\.properties'; then
            echo "tracked credential or local-state file found" >&2
            exit 1
          fi
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          if grep -nR "C:/Users" \
            android/gradle.properties \
            hermes-plugin/hermes-widget/cli.py; then
            echo "machine-specific Windows path found" >&2
            exit 1
          fi
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Field round 8: these gates read git history. A depth-1 clone has no parent,
          # so the evidence check failed on every honest push while the version-bump gate
          # passed without checking anything.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - name: Install Android SDK command-line tools
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/cmdline-tools.zip').extractall('$SDK/cmdline-tools')"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod +x "$SDK/cmdline-tools/latest/bin/"*
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      # The widget design gates (D13): the band ladder, the caps, the WCAG contrast of the
      # shipped palette and the preview/loading resources all fail here, not on a phone.
      - name: Android unit tests (bands, contrast, contract)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --rerun-tasks --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: Android lint (resource and manifest checks)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew lintDebug --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: "Assemble the debug APK (clean: published sizes are clean-build sizes)"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      # versionCode is bumped for a release tag, after app changes have landed; keep the
      # bump-window check on tags so normal development CI does not demand a release.
      - name: Version code was bumped for the shipped app
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check-version-bump.py
      # Field round 5 findings 1-3: an artifact that cannot be attributed to a commit
      # cannot be published. This runs after assembleDebug so the generated BuildConfig is
      # present, and it is pure Python so the review environment can run it too.
      - name: Build provenance (no reissued versionCode, no dirty stamp)
        run: python scripts/check-build-provenance.py
      - name: Release evidence matches the build
        run: python scripts/release-evidence.py --check --doc docs/APK_RELEASE.md
      - name: Print release evidence for this build
        run: python scripts/release-evidence.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
