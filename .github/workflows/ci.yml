name: ci
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Python validator + plugin tests
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
      - name: Contract parity across host and Android contracts
        run: python scripts/check-contract-parity.py
      # Field round 8: an unquoted ": " in one step name made the whole workflow
      # unparseable, so GitHub scheduled nothing and CI was green for four commits
      # without ever running a job. A workflow that cannot parse must fail loudly here.
      - name: Workflow parses and has steps
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check-workflow-yaml.py
      # A closed resource leak used to hide behind a green run. ResourceWarning is an error
      # here, and the dev-mode allocator is on so a leak cannot pass unnoticed.
      - name: Host tests with ResourceWarning as an error
        env:
          HERMES_WIDGET_FORCE_ENV: supported
          PYTHONWARNINGS: "error::ResourceWarning"
          PYTHONDEVMODE: "1"
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests
  # The publication preview has two text backends. CI installs requirements.txt, so
  # CairoSVG is importable there and the Pillow path is only exercised when it is not.
  # test_feature_proposals.py:134 asserted one renderer unguarded and turned CI red for five
  # commits; this job pins the contract in both directions instead.
  preview-renderers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cairosvg, pillow-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install host test dependencies
        if: matrix.backend == 'cairosvg'
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Install Pillow only (no CairoSVG)
        if: matrix.backend == 'pillow-only'
        run: python -m pip install "Pillow>=10.4,<12"
      - name: Show which text backend is importable
        run: |
          python -c "import importlib.util as u; print('cairosvg:', bool(u.find_spec('cairosvg')))"
      # `-p` takes one pattern, and the dashed plugin directory is not importable as a
      # dotted module, so discovery is the only invocation that works here.
      - name: Publication preview tests (this backend)
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests
          -p "test_feature_proposals.py"
      - name: Contract and budget tests (this backend)
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests
          -p "test_contract.py"
  # The Windows launcher branch is exercised on a real Windows interpreter; the
  # same tests run on Linux above by patching the hook's platform decision.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Python validator + plugin tests on Windows
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan and wrapper checks
        run: |
          ! git ls-files | grep -E \
            '\.db$|widget\.db|agent_token|\.keystore|\.jks|\.p8|local\.properties'
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          ! grep -R "C:/Users" \
            android/gradle.properties \
            hermes-plugin/hermes-widget/cli.py
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK command-line tools
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/cmdline-tools.zip').extractall('$SDK/cmdline-tools')"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod +x "$SDK/cmdline-tools/latest/bin/"*
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      # The widget design gates (D13): the band ladder, the caps, the WCAG contrast of the
      # shipped palette and the preview/loading resources all fail here, not on a phone.
      - name: Android unit tests (bands, contrast, contract)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --rerun-tasks --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: Android lint (resource and manifest checks)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew lintDebug --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      - name: "Assemble the debug APK (clean: published sizes are clean-build sizes)"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m
      # Field round 5: four different APKs shipped as versionCode 2, and the release doc
      # described a commit three behind. Both are now gates rather than habits.
      - name: Version code was bumped for the shipped app
        run: python scripts/check-version-bump.py
      - name: Release evidence matches the build
        run: python scripts/release-evidence.py --check --doc docs/APK_RELEASE.md
      - name: Print release evidence for this build
        run: python scripts/release-evidence.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
