name: ci
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Python validator + plugin tests
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
      - name: Contract parity across host and Android contracts
        run: python scripts/check-contract-parity.py
  # The Windows launcher branch is exercised on a real Windows interpreter; the
  # same tests run on Linux above by patching the hook's platform decision.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host test dependencies
        run: >-
          python -m pip install
          -r hermes-plugin/hermes-widget/requirements.txt
      - name: Python validator + plugin tests on Windows
        env:
          HERMES_WIDGET_FORCE_ENV: supported
        run: >-
          python -m unittest discover
          -s hermes-plugin/hermes-widget/tests -v
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan and wrapper checks
        run: |
          ! git ls-files | grep -E \
            '\.db$|widget\.db|agent_token|\.keystore|\.jks|\.p8|local\.properties'
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          ! grep -R "C:/Users" \
            android/gradle.properties \
            hermes-plugin/hermes-widget/cli.py
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Android unit tests (wrapper only, no local.properties)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --rerun-tasks
