name: hermes-widget
version: 3.4.0
license: MIT
description: >-
  Hermes personal visual channel: accessible text, safe static SVG,
  local raster media, private authenticated delivery,
  content-free priority wakeups, durable action intents, proactive cache-safe guidance,
  and periodic refresh.
author: Hermes Widget contributors
kind: standalone
entrypoint: __init__.py
provides_tools:
  - widget_list
  - widget_read_events
  - widget_publish
  - widget_preview
  - widget_read_intents
  - widget_resolve_intent
  - widget_ask
  - widget_read_questions
  - widget_watch
  - widget_wake_test
  - widget_set_quiet_hours
  - widget_status
provides_commands:
  - widget
metadata:
  transport: http
  default_port: 8788
  transport_version: v1
