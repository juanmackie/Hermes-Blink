name: hermes-widget
version: 2.0.0
description: "Hermes home-screen widget v2: brief-focused layouts (column/row/box/list/text/badge/stat/progress/calendar-agenda/button/list_item), private HTTPS, QR pairing, 6-hour brief."
author: Hermes Widget contributors
kind: standalone
entrypoint: __init__.py
provides_tools:
  - widget_update
  - widget_list
  - widget_read_events
  - widget_mint_pairing_code
provides_commands:
  - widget
metadata:
  transport: http
  default_port: 8788
  transport_version: v1
  layout_contract: v2
